name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Least privilege: nothing in this workflow writes to the repository.
permissions:
  contents: read

# A rapid series of pushes should leave one run standing, not three
# full matrices racing each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./cmd/...

      - name: Test
        run: go test -race -count=1 -timeout=300s -coverprofile=coverage.out ./...

      # Surfaced in the job log rather than shipped to a coverage
      # service — the trend is the useful part and this keeps the
      # pipeline dependency-free.
      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1
          go tool cover -func=coverage.out | sort -k3 -nr | head -20

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # cmd/platypus-server/dependencies_test.go exists because
      # govulncheck once found 16 patch-level stdlib advisories here.
      # That test is a string assertion standing in for this tool; run
      # the real thing so the next advisory is caught too.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan root module
        run: $(go env GOPATH)/bin/govulncheck ./...

      - name: Scan desktop module
        working-directory: desktop
        run: $(go env GOPATH)/bin/govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint-action pulls a pre-built binary that's typically one Go
      # version behind and refuses to lint modules whose `go` directive is
      # higher than the binary's build version. Build from source with the
      # same toolchain setup-go pulled from go.mod so the lint binary is
      # built with Go ≥ the module's target.
      #
      # The pinned version matters for the same reason: a golangci-lint
      # release that predates the module's Go version cannot read the
      # compiler's export data ("export data version 4 is greater than
      # maximum supported version 2") and fails every package with a
      # typecheck error, even when built with the newer toolchain. Bump
      # this pin whenever the `go` directive moves to a new minor.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...
