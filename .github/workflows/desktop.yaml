name: Desktop

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yaml"
      - "Makefile"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yaml"
      - "Makefile"
  workflow_dispatch:

# Least privilege by default; the build job re-grants what it needs to
# publish releases.
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Run tests
        run: make desktop-test

  frontend:
    name: Frontend test + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install deps
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      # tsc already runs inside build:desktop, but only on the release
      # path. Run it here so a type error fails a PR instead of a tag.
      - name: Typecheck
        working-directory: desktop/frontend
        run: pnpm exec tsc --noEmit

      # Blocking. `lint` runs oxlint with --type-aware, so this covers
      # both the parser-only correctness class and the type-aware rules
      # (no-floating-promises, no-base-to-string, …). The remaining
      # react-hooks / set-state-in-effect warnings print but do not
      # fail — see .oxlintrc.json for why each is a warning.
      - name: Lint
        working-directory: desktop/frontend
        run: pnpm run lint

      - name: Test
        working-directory: desktop/frontend
        run: pnpm test

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Re-grants what the workflow-level read-only default withholds:
    # this job publishes release assets via softprops/action-gh-release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config build-essential

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis

      - name: Cache Wails CLI
        uses: actions/cache@v6
        with:
          path: ~/go/bin/wails
          key: ${{ runner.os }}-wails-v2.15.0

      # Must match the wails/v2 version in desktop/go.mod — the CLI
      # generates the bindings and the runtime shim the library then
      # links against.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install pnpm deps
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          VERSION=${{ github.ref_name }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Windows build with NSIS installer
            cd desktop && ~/go/bin/wails build -clean -nsis -ldflags "-s -w -X 'main.Version=$VERSION'"
          else
            make desktop-build LDFLAGS="-s -w -X 'main.Version=$VERSION'"
          fi
        shell: bash

      # create-dmg is environment setup, not packaging, so it stays
      # here; everything else moved into the script below.
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # One script for all three platforms. It reads the binary and
      # product names out of desktop/wails.json instead of repeating
      # them, and scripts/package-desktop.test.sh exercises every
      # branch against a fake build directory — so a mistake in the
      # Windows path surfaces on any machine rather than during a tag
      # build, after three OSes have already compiled.
      - name: Package artifacts
        run: |
          case "${{ runner.os }}" in
            Linux)   os=linux ;;
            Windows) os=windows ;;
            macOS)   os=darwin ;;
            *) echo "unsupported runner: ${{ runner.os }}" >&2; exit 1 ;;
          esac
          scripts/package-desktop.sh --version "${{ github.ref_name }}" --os "$os"
        shell: bash

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            desktop/build/bin/*.zip
            desktop/build/bin/*.tar.gz
            desktop/build/bin/*.exe
            desktop/build/bin/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: desktop/build/bin/*
          if-no-files-found: error
          retention-days: 14
