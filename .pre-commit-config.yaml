# Generated / vendored Go paths excluded from the formatting + import hooks;
# mirrors the `exclusions.paths` block in .golangci.yml so local and CI agree.
exclude: ^(pkg/proto/|pkg/dependencies/)

repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        language: system
        types: [go]
        entry: gofmt -l -w

      - id: goimports
        name: goimports (pinned golang.org/x/tools v0.44.0, -local github.com/WangYihang/Platypus)
        language: system
        types: [go]
        entry: bash -c '
          set -e;
          WANT="golang.org/x/tools v0.44.0";
          BIN="$(go env GOPATH)/bin/goimports";
          if [ ! -x "$BIN" ] || ! go version -m "$BIN" 2>/dev/null | grep -q "$WANT"; then
            go install golang.org/x/tools/cmd/goimports@v0.44.0;
          fi;
          "$BIN" -l -w -local github.com/WangYihang/Platypus "$@"' --

      - id: go-mod-tidy
        name: go mod tidy
        language: system
        files: ^(go\.mod|go\.sum|.+\.go)$
        pass_filenames: false
        entry: go mod tidy

      - id: golangci-lint
        name: golangci-lint (pinned v2.13.1 — must match .github/workflows/ci.yaml)
        language: system
        types: [go]
        pass_filenames: false
        entry: bash -c '
          set -e;
          BIN="$(go env GOPATH)/bin/golangci-lint";
          if [ ! -x "$BIN" ] || ! "$BIN" version 2>/dev/null | grep -q "2.13.1"; then
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1;
          fi;
          "$BIN" run ./...'

      # Frontend. oxlint stands in for ESLint — see the note at the top
      # of desktop/frontend/.oxlintrc.json. It reads its own config, so
      # this only fires when a frontend source file is staged, and it
      # no-ops when node_modules is absent: a Go-only contributor should
      # not have to install the frontend toolchain to commit.
      - id: oxlint
        name: oxlint (desktop/frontend)
        language: system
        files: ^desktop/frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
        entry: bash -c '
          cd desktop/frontend;
          if [ ! -x node_modules/.bin/oxlint ]; then
            echo "oxlint not installed (cd desktop/frontend && pnpm install) - skipping";
            exit 0;
          fi;
          node_modules/.bin/oxlint'
